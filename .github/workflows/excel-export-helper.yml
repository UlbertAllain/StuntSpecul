name: Excel Export Helper

on:
  push:
    branches: [helper/excel-export-deps]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install Excel dependency
        run: npm install exceljs@4.4.0 --save
      - name: Format changed files
        run: npx prettier --write src/components/portal/portal.css src/components/portal/staff/history.tsx src/server/firestore-app.ts package.json package-lock.json
      - name: Commit dependency and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/portal/portal.css src/components/portal/staff/history.tsx src/server/firestore-app.ts package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare Excel export dependency"
            git push
          fi
      - run: npm run check
      - run: npm run build
      - run: node tests/deployment-smoke.mjs
