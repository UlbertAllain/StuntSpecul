name: Format Parent Test
on:
  push:
    branches: [feature/client-tracking-portal-final2]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/client-tracking-portal-final2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/parent-account.test.mjs src/components/portal/dashboard.tsx src/components/portal/monitoring.tsx src/components/screening/station-display.tsx src/server/station.ts README.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/parent-account.test.mjs src/components/portal/dashboard.tsx src/components/portal/monitoring.tsx src/components/screening/station-display.tsx src/server/station.ts README.md
          git diff --cached --quiet || git commit -m "style: format client tracking changes"
          git push origin HEAD:feature/client-tracking-portal-final2
