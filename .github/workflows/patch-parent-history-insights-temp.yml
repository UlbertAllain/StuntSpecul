name: Patch Parent History Insights Temp
on:
  push:
    branches: [feature/public-landing-device-monitoring-insights]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-landing-device-monitoring-insights
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Wire parent growth insights
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/portal/parent-account-portal.tsx')
          text = path.read_text()
          import_anchor = 'import { ResultSummary } from "./result-summary";\n'
          import_line = 'import { ParentGrowthInsights } from "./parent-growth-insights";\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          history_anchor = '''      </div>\n      {examinations.length === 0 ? (\n'''
          history_insert = '''      </div>\n      <ParentGrowthInsights examinations={examinations} />\n      {examinations.length === 0 ? (\n'''
          if '<ParentGrowthInsights examinations={examinations} />' not in text:
              if history_anchor not in text:
                  raise SystemExit('History anchor not found')
              text = text.replace(history_anchor, history_insert, 1)
          path.write_text(text)
          PY
      - run: npx prettier --write src/components/portal/parent-account-portal.tsx src/components/portal/parent-growth-insights.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/portal/parent-account-portal.tsx src/components/portal/parent-growth-insights.tsx
          git diff --cached --quiet || git commit -m "feat(parent): show growth insights in history"
          git push origin HEAD:feature/public-landing-device-monitoring-insights
