name: Temporary Format Fix
on:
  push:
    branches: [model-a-v2-1-integration]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: model-a-v2-1-integration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format changed sources
        run: npx prettier --write src/components/landing/public-landing.tsx src/components/portal/parent-growth-insights.tsx src/components/portal/parent-portal.tsx src/components/portal/portal.css src/components/screening/results.tsx src/server/parent-account.ts tests/parent-account.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/public-landing.tsx src/components/portal/parent-growth-insights.tsx src/components/portal/parent-portal.tsx src/components/portal/portal.css src/components/screening/results.tsx src/server/parent-account.ts tests/parent-account.test.mjs
          git commit -m "style: apply project formatter"
          git push origin HEAD:model-a-v2-1-integration
