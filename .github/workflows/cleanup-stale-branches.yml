name: Cleanup stale branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'UlbertAllain/StuntSpecul'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Delete stale remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches=(
            "codex/fix-vercel-runtime"
            "feature/client-parent-portal"
            "feature/client-parent-portal-v2"
            "feature/client-parent-portal-v3"
            "feature/client-tracking-portal"
            "feature/client-tracking-portal-final"
            "feature/client-tracking-portal-final2"
            "feature/public-landing-device-monitoring-insights"
            "fix/password-toggle-station-copy"
            "model-a-v2-1-integration"
            "refactor/guest-screening-flow"
          )

          for branch in "${branches[@]}"; do
            echo "Deleting $branch"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" || true
          done

      - name: Remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-stale-branches.yml
          git commit -m "chore: remove one-shot branch cleanup workflow"
          git push origin HEAD:main
