name: Format Final Cleanup Temp
on:
  push:
    branches: [feature/public-landing-device-monitoring-insights]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-landing-device-monitoring-insights
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/landing/public-landing.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add src/components/landing/public-landing.tsx
          git diff --cached --quiet || git commit -m "style: format final landing cleanup"
          git push origin HEAD:feature/public-landing-device-monitoring-insights
