name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier src/app/api/visual-analysis/route.ts src/components/portal/admin/face-test.tsx src/components/portal/parent/blog.tsx src/components/portal/portal.css src/components/portal/staff/blogs.tsx src/components/screening/screening.css src/hooks/use-screening-session.ts src/lib/anthropometry.ts src/lib/cloudinary.ts --write
          git diff -- src/app/api/visual-analysis/route.ts src/components/portal/admin/face-test.tsx src/components/portal/parent/blog.tsx src/components/portal/portal.css src/components/portal/staff/blogs.tsx src/components/screening/screening.css src/hooks/use-screening-session.ts src/lib/anthropometry.ts src/lib/cloudinary.ts
          exit 1
      - run: npm run build
      - run: node tests/deployment-smoke.mjs
