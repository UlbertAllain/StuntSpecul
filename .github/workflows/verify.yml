name: Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write \
            src/components/portal/parent/growth-insights.tsx \
            src/components/portal/parent/history-detail-page.tsx \
            src/components/portal/portal.css \
            src/components/screening/results.tsx \
            src/components/screening/screening.css \
            src/lib/stunting-risk.ts \
            tests/growth-recommendations.test.mjs \
            docs/SCREENING_FLOW.md
          git diff -- \
            src/components/portal/parent/growth-insights.tsx \
            src/components/portal/parent/history-detail-page.tsx \
            src/components/portal/portal.css \
            src/components/screening/results.tsx \
            src/components/screening/screening.css \
            src/lib/stunting-risk.ts \
            tests/growth-recommendations.test.mjs \
            docs/SCREENING_FLOW.md
          exit 1
      - run: npm run check
      - run: npm run build
      - run: node tests/deployment-smoke.mjs
