name: Format Password Station Temp
on:
  push:
    branches: [fix/password-toggle-station-copy]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/password-toggle-station-copy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/screening/station-idle-screen.tsx src/components/portal/login.tsx src/components/portal/password-input.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/screening/station-idle-screen.tsx src/components/portal/login.tsx src/components/portal/password-input.tsx
          git diff --cached --quiet || git commit -m "style: format password and station polish"
          git push origin HEAD:fix/password-toggle-station-copy
