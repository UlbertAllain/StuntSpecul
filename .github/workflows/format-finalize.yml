name: Format Finalize
on:
  push:
    branches: [feature/client-tracking-portal-final2]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/client-tracking-portal-final2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/portal/monitoring.tsx src/server/station.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/portal/monitoring.tsx src/server/station.ts
          git diff --cached --quiet || git commit -m "style: format staff finalization flow"
          git push origin HEAD:feature/client-tracking-portal-final2
