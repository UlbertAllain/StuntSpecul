name: Format current StuntSpecula patches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format touched files
        run: >
          npx prettier --write
          src/components/portal/portal.css
          src/components/screening/screening.css
          src/components/screening/results.tsx
          src/components/screening/nutri-mirror.tsx
          src/components/screening/examination-stage.tsx
          src/components/screening/countdown-cue.tsx
          src/hooks/use-speech.ts
          src/lib/sound-effects.ts
          scripts/migrate.mjs
          scripts/migration-checksum.mjs
          tests/migration-checksum.test.mjs
          package.json
          package-lock.json
      - name: Commit formatting and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-current-patches.yml
          git add src scripts tests package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format current StuntSpecula patches"
          git push origin HEAD:main
