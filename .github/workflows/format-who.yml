name: Format WHO Changes
on:
  push:
    branches: [refactor/guest-screening-flow]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/guest-screening-flow
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: npx prettier --write src/components/portal/parent-screening.tsx src/components/portal/result-summary.tsx src/components/screening/results.tsx src/lib/growth.ts src/server/gemini.ts src/server/screenings.ts tests/screening.test.mjs
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/portal/parent-screening.tsx src/components/portal/result-summary.tsx src/components/screening/results.tsx src/lib/growth.ts src/server/gemini.ts src/server/screenings.ts tests/screening.test.mjs
          git diff --cached --quiet || git commit -m "style: format WHO screening changes"
          git push origin HEAD:refactor/guest-screening-flow
